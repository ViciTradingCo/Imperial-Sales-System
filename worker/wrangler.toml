name = "eec-sales-system-api"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Public, non-secret configuration. Fill these in for your deployment.
#   CORE_SPREADSHEET_ID — the EEC Core spreadsheet's ID
#   GOOGLE_CLIENT_ID    — the OAuth client ID (must match app-config.json)
#   ALLOWED_ORIGIN      — comma-separated site origins allowed to call the API,
#                         e.g. "https://meretheec.github.io" (add
#                         "http://localhost:5173" while developing)
[vars]
CORE_SPREADSHEET_ID = "1-T-R_5BJmaeHv3fkqGSI06xKc9yXgI3pVqXQ1DzgiGk"
GOOGLE_CLIENT_ID = "987037150604-djt5q7a16kgs77jvc8lnhrk74p76u5oj.apps.googleusercontent.com"
ALLOWED_ORIGIN = "https://meretheec.github.io,http://localhost:5173"
# Backups are now operator-downloaded files (admin → Network Settings → Data
# backup: Export / Import), not a scheduled Sheets mirror.

# SECRET (never in this file) — set once with:
#   wrangler secret put SA_KEY
# Paste the entire service-account JSON key when prompted.

# D1 (the live transactional store for inventory/sales/intake).
[[d1_databases]]
binding = "DB"
database_name = "eec-ledger"
database_id = "6749b2d0-e59f-4fb2-8d92-d1e2c5716b6b"

# OPTIONAL cross-isolate cache. The code uses KV automatically when this binding
# exists and falls back to the per-isolate in-memory cache otherwise, so leaving
# it commented is safe. To turn it on:
#   1. Cloudflare dashboard → Workers & Pages → KV → Create namespace ("eec-cache")
#   2. Uncomment below and paste its ID, then redeploy.
# [[kv_namespaces]]
# binding = "KV"
# id = "<your-kv-namespace-id>"
