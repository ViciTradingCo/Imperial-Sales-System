name = "eec-sales-system-api"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Public, non-secret configuration. Fill these in for your deployment.
#   CORE_SPREADSHEET_ID — the EEC Core spreadsheet's ID
#   GOOGLE_CLIENT_ID    — the OAuth client ID (must match app-config.json)
#   ALLOWED_ORIGIN      — comma-separated site origins allowed to call the API,
#                         e.g. "https://meretheec.github.io" (add
#                         "http://localhost:5173" while developing)
[vars]
CORE_SPREADSHEET_ID = "REPLACE_WITH_YOUR_EEC_CORE_SPREADSHEET_ID"
GOOGLE_CLIENT_ID = "REPLACE_WITH_YOUR_OAUTH_CLIENT_ID.apps.googleusercontent.com"
ALLOWED_ORIGIN = "http://localhost:5173"

# SECRET (never in this file) — set once with:
#   wrangler secret put SA_KEY
# Paste the entire service-account JSON key when prompted.
