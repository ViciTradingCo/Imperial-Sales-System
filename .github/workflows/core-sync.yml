name: Core background sync

# Replaces the Apps Script every-5-minutes trigger. On a schedule, this runs the
# Core maintenance crawl unattended (identity refresh, VALID/EXPIRED recompute,
# auto-flash of out-of-sync ledgers) as the service account.
#
# GitHub's shortest cron is every 5 minutes, and scheduled runs are best-effort
# (they can be delayed under load) — fine for maintenance. The registry stays
# correct; a delayed run just means a slightly later refresh.
#
# The actual crawl logic (ported from core_Main.gs) lands with Phase 5/7; this
# skeleton wires the schedule, secret, and runner so the plumbing is proven
# early. It no-ops cleanly until the script exists.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Core maintenance crawl
        env:
          SA_KEY: ${{ secrets.SA_KEY }}
          CORE_SPREADSHEET_ID: ${{ vars.CORE_SPREADSHEET_ID }}
        run: |
          if [ -f scripts/core-sync.mjs ]; then
            node scripts/core-sync.mjs
          else
            echo "core-sync.mjs not present yet — skipping (Phase 5/7 adds it)."
          fi
