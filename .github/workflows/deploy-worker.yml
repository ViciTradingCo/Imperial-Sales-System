name: Deploy Worker API

# Deploys the Cloudflare Worker (the backend API) from GitHub — no local
# terminal needed.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — a Cloudflare token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID — your Cloudflare account ID (dashboard → Workers & Pages, right sidebar)
#
# (No SA_KEY — Google Sheets is no longer used; D1 is the sole datastore.)
#
# Trigger it from the Actions tab (Run workflow) or by pushing changes under worker/.
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # NOTE: no D1 migration step — the Worker ensures its schema in-code
      # (idempotent CREATE TABLE IF NOT EXISTS), so a fresh D1 database just works.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
